[package]
name = "alice-serial"
version = "0.2.0"
edition = "2021"
description = "Serialization formats (MessagePack, CBOR-like, binary encoding)"
repository = "https://github.com/ext-sakamoro/ALICE-Serial"
keywords = ["serialization", "messagepack", "cbor", "encoding", "binary"]
categories = ["encoding", "parser-implementations"]
license = "LicenseRef-Proprietary"
publish = false

[features]
# bincode1: the bincode 1 default layout through serde (src/bincode1-layout.txt)
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
