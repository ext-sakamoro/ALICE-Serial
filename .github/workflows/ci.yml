name: CI

# 依存 0 crate 向けの構成
# 2026-09-17 展開: それまで fmt + actionlint のみで test / clippy が CI に無かった
# (strict-eval 5、protocol 1.0.x 12 crate) toolchain は rust-toolchain.toml の pin

on:
  push:
    # ci/**: the same checks on a branch before it is fast-forwarded to main
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# on main each commit has a group of its own and a run there is never
# cancelled; a newer push cancels an older run only off main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  test:
    name: Test + Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (pedantic、all targets、all features)
        run: cargo clippy --locked --all-targets --all-features -- -W clippy::pedantic -D warnings

      - name: Test
        run: cargo test --locked --all-features

      - name: Doc (-D warnings)
        run: cargo doc --locked --no-deps --all-features

  no_std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `targets:` 入力は rust-toolchain.toml の pin と組むと silent skip するので明示 add
      - name: Add bare-metal target
        run: rustup target add thumbv7em-none-eabihf
      - name: Check (no_std、bare-metal)
        run: cargo check --locked --lib --no-default-features --target thumbv7em-none-eabihf
      - name: Clippy (no_std、bare-metal)
        run: cargo clippy --locked --lib --no-default-features --target thumbv7em-none-eabihf -- -W clippy::pedantic -D warnings
      - name: Check (no_std + serde、bare-metal)
        run: cargo check --locked --lib --features serde --target thumbv7em-none-eabihf

  bincode1:
    name: bincode1 (bincode out of the graph, differential against bincode 1 / 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - name: bincode absent from the dependency graph
        run: bash scripts/no_bincode_in_graph.sh
      # fuzz/ has its own lockfile, so bincode stays out of alice-serial's graph
      - name: Differential test against bincode 1.3.3 and 2.0.1
        run: cargo test --locked --release --manifest-path fuzz/Cargo.toml --test bincode1_diff -- --nocapture

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check
