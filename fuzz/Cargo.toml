[package]
name = "alice-serial-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# the differential check against bincode lives only here, in a crate with its
# own lockfile, so bincode never enters alice-serial's own dependency graph
[lib]
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bincode1-ref = { package = "bincode", version = "=1.3.3" }
bincode2-ref = { package = "bincode", version = "=2.0.1", features = ["serde"] }

[dependencies.alice-serial]
path = ".."
features = ["serde"]

# cargo-machete: libfuzzer-sys is referenced only inside the fuzz_target! macro
[package.metadata.cargo-machete]
ignored = ["libfuzzer-sys"]

# any bytes: decode never panics, and what it accepts re-encodes to the same bytes
[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
doc = false
test = false
bench = false

# a value built from the bytes: decode(encode(v)) is v with its maps sorted,
# and encoding that again gives the same bytes
[[bin]]
name = "fuzz_roundtrip"
path = "fuzz_targets/fuzz_roundtrip.rs"
doc = false
test = false
bench = false

# a value built from the bytes and the bytes themselves, against bincode 1.3.3
# and bincode 2.0.1 with config::legacy(): the same bytes out, the same values
# and errors in (src/lib.rs)
[[bin]]
name = "fuzz_bincode1_diff"
path = "fuzz_targets/fuzz_bincode1_diff.rs"
doc = false
test = false
bench = false
